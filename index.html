<!doctype html>
<html lang="zh-CN" class="astrobox-transparent">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="用于 AstroBox 个人主页的极简音乐播放器，支持 SPL 双语歌词与翻译切换。">
  <title>AstroBox 音乐播放器</title>
  <link rel="stylesheet" href="assets/css/player.css">
  <script type="module" src="assets/js/astrobox.js"></script>
  <script type="module" src="assets/js/player.js"></script>
</head>
<body>
  <main class="player" id="player" aria-label="音乐播放器">
    <section class="record" aria-label="歌曲">
      <h1 id="title">正在载入歌曲…</h1>
      <div class="cover-space">
        <button class="cover" id="cover" type="button" aria-label="播放" aria-pressed="false" title="点击封面播放或暂停">
          <img id="artwork" alt="专辑封面" width="800" height="800" draggable="false">
        </button>
      </div>
      <div class="progress">
        <input class="seek" id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度">
        <div class="times" aria-hidden="true"><span id="elapsed">00:00</span><span id="duration">00:00</span></div>
      </div>
      <div class="toolbar" aria-label="歌词显示设置">
        <button class="tool translation-toggle" id="translation-toggle" type="button" aria-label="显示歌词翻译" aria-pressed="true" aria-controls="lyric-list" title="显示或隐藏歌词翻译" disabled>
          <span class="translation-icon" aria-hidden="true">译</span>
          <span>翻译</span><span class="toggle-dot" aria-hidden="true"></span>
        </button>
      </div>
    </section>
    <section class="lyrics at-start" id="lyrics" aria-label="歌词，点击可跳转">
      <div class="lyric-list" id="lyric-list" aria-busy="true"></div>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <audio id="audio" preload="metadata" src="assets/audio/track.mp3"></audio>
  <noscript>请开启 JavaScript 以使用播放器。</noscript>
</body>
</html>
